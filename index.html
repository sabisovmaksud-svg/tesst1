<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #12141d;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e2230;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #c084fc;
    }
    p {
      color: #9ca3af;
      margin-bottom: 20px;
    }
    button {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Психотип и Совместимость</h1>
    <p>Тест успешно подключен и готов к работе!</p>
    <button onclick="alert('Все работает!')">Начать тест</button>
  </div>
  <script>
    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
